<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}ZapTips Console{% endblock %}</title>
  <link rel="stylesheet" href="/static/console.css">
</head>
<body>
  <!--
    Autoescape esta ligado (app/console/main.py) - qualquer campo vindo
    de picks/raw_picks/sources e texto raspado de Telegram/WordPress,
    nao confiavel. NUNCA usar `| safe` em campo vindo dessas tabelas
    neste diretorio de templates.
  -->
  <header class="topo">
    <div class="topo-conteudo">
      <span class="marca"><span class="ponto"></span>ZapTips</span>
      <nav>
        <a href="/saude" class="{{ 'ativo' if request.url.path == '/saude' else '' }}">Saúde</a>
        <a href="/curadoria" class="{{ 'ativo' if request.url.path == '/curadoria' else '' }}">Curadoria</a>
        <a href="/envio" class="{{ 'ativo' if request.url.path.startswith('/envio') else '' }}">Envio</a>
        <a href="/relatorios" class="{{ 'ativo' if request.url.path == '/relatorios' else '' }}">Relatórios</a>
      </nav>
    </div>
  </header>
  <main>
    {% block conteudo %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
