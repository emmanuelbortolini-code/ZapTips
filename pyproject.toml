[project]
name = "zaptips"
version = "0.1.0"
description = "Curadoria de palpites esportivos com envio assistido por WhatsApp"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.1",
    "structlog>=24.1",
    "rapidfuzz>=3.9",
    "beautifulsoup4>=4.12",
    "anthropic>=0.69",
    "jinja2>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "apscheduler>=3.11.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
